<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Utkarsh | u.design</title>
<link rel="icon" type="image/png" href="images/about-page/logo.png">
<meta property="og:title" content="Utkarsh | u.design"><meta property="og:description" content="Multidisciplinary designer at NID Bangalore: retail, spaces, brands and products."><meta property="og:image" content="https://udotdesign.me/images/about-page/photo.jpg"><meta property="og:url" content="https://udotdesign.me/">
<meta name="description" content="Utkarsh, a multidisciplinary designer at NID Bangalore: retail spaces, fixtures, products, brands and the stories around them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Unbounded:wght@400..900&family=Inter:wght@400;500;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#f4f4f1;--ground-2:#e9e9e5;--ink:#121212;--ink-2:#4a4a47;--line:rgba(18,18,18,.16);
  --night:#141413;--night-2:#1d1d1b;--night-line:rgba(244,244,241,.14);--night-ink:#f4f4f1;--night-ink-2:#a9a9a3;
  --yellow:#ffcb05;--glow:255,200,0;--on-glow:#121212;
  --display:"Helvetica Neue",Helvetica,Arial,sans-serif;--head:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --wrap:1280px;--gut:clamp(18px,4vw,48px);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground:#f4f4f1;--ink:#121212;color-scheme:light}}
:root[data-theme="dark"]{--ground:#f4f4f1;--ink:#121212;color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(20px + env(safe-area-inset-top,0px))}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--display);font-size:clamp(17px,1.15vw,19px);line-height:1.55;-webkit-tap-highlight-color:transparent;overflow:hidden;height:100%}
body.entered{overflow:auto;height:auto}
::selection{background:var(--yellow);color:var(--on-glow)}
a{color:inherit}
:focus-visible{outline:3px dashed var(--yellow);outline-offset:4px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
h1,h2,h3{margin:0;font-family:var(--head)}
.row .t,.bar .logo,.street .mark,.map .nm,.slot strong,.route .stop b{font-family:var(--head)}

/* ---------- 1. the street ---------- */
.street{position:fixed;inset:0;overflow:hidden;-webkit-user-select:none;user-select:none;background:var(--ground)}
body.entered .street{display:none}
.street canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.street .mark{position:absolute;z-index:3;left:var(--gut);top:calc(18px + env(safe-area-inset-top,0px));font-weight:800;font-size:20px;letter-spacing:-.02em;}
.loader{position:absolute;z-index:3;left:var(--gut);bottom:calc(22px + env(safe-area-inset-bottom,0px));font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;transition:opacity .6s}
.loaded .loader{opacity:0}
.bubble{position:absolute;z-index:4;left:0;top:0;transform:translate(-100%,-100%) translateY(6px) scale(.92);transform-origin:100% 100%;opacity:0;
  color:var(--ink);border-radius:16px 16px 4px 16px;padding:9px 13px 10px;width:max-content;max-width:min(215px,62vw);
  font:600 14px/1.35 var(--display);letter-spacing:-.005em;text-align:left;cursor:pointer;
  transition:opacity .4s var(--ease),transform .5s var(--ease),background .25s,box-shadow .25s}
.bubble.show{opacity:1;transform:translate(-100%,-100%) scale(1)}
.bubble.show:hover{background:linear-gradient(135deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.45) 100%);box-shadow:0 18px 38px -8px rgba(0,0,0,.1),inset 0 1.5px 1.5px 0 rgba(255,255,255,1)}
.bubble.show:active{transform:translate(-100%,-100%) scale(.97)}
.bubble::before{content:"";position:absolute;right:-1px;bottom:-9px;width:12px;height:10px;background:rgba(255,255,255,.40);border-right:1.5px solid rgba(255,255,255,.8);
  clip-path:polygon(0 0,100% 0,100% 100%)}
.night .bubble::before{background:rgba(42,42,39,.7);border-color:rgba(255,255,255,.25)}
.bubble .l1,.bubble .l2{display:block;min-height:1.35em}
.bubble .l1{font-weight:500;color:var(--ink-2)}
.bubble .l2{margin-top:1px;font-weight:700}
.bubble .l2 mark{background:linear-gradient(transparent 58%,rgba(var(--glow),.75) 58%);color:var(--ink);padding:0 1px}
.caret{display:inline-block;width:1.5px;height:.95em;background:var(--ink);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.flash{position:fixed;inset:0;z-index:20;background:var(--yellow);pointer-events:none;opacity:0;clip-path:circle(0 at var(--cx,70%) var(--cy,45%))}

/* ---------- Robust Liquid Glass Effect (40% Opacity) ---------- */
.glass{position:relative;isolation:isolate;
  background:rgba(255,255,255,.40);
  background:linear-gradient(135deg,rgba(255,255,255,.48) 0%,rgba(255,255,255,.32) 100%);
  -webkit-backdrop-filter:blur(32px) saturate(210%) brightness(1.08) contrast(106%);
  backdrop-filter:blur(32px) saturate(210%) brightness(1.08) contrast(106%);
  border:1.5px solid rgba(255,255,255,.75);
  box-shadow:
    0 24px 48px -12px rgba(0,0,0,.10),
    0 4px 14px -2px rgba(0,0,0,.04),
    inset 0 1.5px 1.5px 0 rgba(255,255,255,1),
    inset 1.5px 0 2px 0 rgba(255,255,255,.60),
    inset 0 -1.5px 1.5px 0 rgba(255,255,255,.40),
    inset 0 0 24px 0 rgba(255,255,255,.25);
  transition:background .25s var(--ease),border-color .25s var(--ease),box-shadow .25s var(--ease)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:
    radial-gradient(130% 85% at 20% 0%,rgba(255,255,255,.50) 0%,rgba(255,255,255,0) 60%),
    linear-gradient(180deg,rgba(255,255,255,.20) 0%,rgba(255,255,255,0) 35%)}
/* frosted glass: milky frost, thick light-catching rim, soft specular sheen (light mode only) */
:root:not([data-theme="dark"]) .street:not(.night) .glass,:root:not([data-theme="dark"]) #site .glass:not(.night .glass){
  background:linear-gradient(160deg,rgba(255,255,255,.05) 0%,rgba(232,240,255,.05) 50%,rgba(196,214,255,.05) 100%);
  border-color:transparent;
  -webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);
  box-shadow:0 34px 64px -24px rgba(40,70,170,.30),0 10px 22px -8px rgba(40,70,170,.14),
    inset 0 2px 2px rgba(255,255,255,.95),inset 0 -2px 3px rgba(255,255,255,.45),inset 0 0 36px rgba(255,255,255,.5),inset 0 -14px 28px -10px rgba(120,155,255,.25)}
:root:not([data-theme="dark"]) .street:not(.night) .glass:not(.bubble)::before,:root:not([data-theme="dark"]) #site .glass:not(.night .glass):not(.bubble)::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:2.5px;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,1) 0%,rgba(255,255,255,.45) 35%,rgba(150,180,255,.75) 72%,rgba(255,255,255,1) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@media (prefers-reduced-transparency:reduce){.glass{background:#fff!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
.night .glass{
  background:rgba(255,255,255,.08);
  background:linear-gradient(135deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.04) 100%);
  border:1.5px solid rgba(255,255,255,.22);
  color:#f4f4f1;
  -webkit-backdrop-filter:blur(32px) saturate(210%) brightness(1.10) contrast(106%);
  backdrop-filter:blur(32px) saturate(210%) brightness(1.10) contrast(106%);
  box-shadow:
    0 28px 56px -12px rgba(0,0,0,.60),
    0 4px 14px rgba(0,0,0,.30),
    inset 0 1.5px 1.5px 0 rgba(255,255,255,.40),
    inset 1px 0 1.5px 0 rgba(255,255,255,.20),
    inset 0 -1px 1px 0 rgba(255,255,255,.10),
    inset 0 0 24px 0 rgba(255,255,255,.06)}
.night .glass::after{
  background:radial-gradient(130% 85% at 20% 0%,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 60%)}
.street .card{position:absolute;z-index:5;left:var(--gut);top:calc(18px + env(safe-area-inset-top,0px));border-radius:22px;padding:15px 18px 16px;max-width:min(330px,calc(100vw - 150px))}
.card p{margin:0}
.card .hi{font:700 17px/1.2 var(--head);letter-spacing:-.02em}
.card .role{font-size:13px;font-weight:600;color:var(--ink-2);margin-top:6px}
.card .tag{font-size:15px;line-height:1.35;margin-top:2px}
.night .card .role{color:rgba(244,244,241,.7)}
.ctrls{position:absolute;z-index:5;right:var(--gut);top:calc(18px + env(safe-area-inset-top,0px));display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 15px 0 12px;border-radius:999px;font:600 14px/1 var(--display);color:var(--ink);cursor:pointer;transition:transform .15s}
.chip:active{transform:scale(.96)}
.chip .ic{width:18px;height:18px;display:grid;place-items:center}
.chip svg{width:18px;height:18px;fill:currentColor}
.dock{position:fixed;z-index:12;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:2px;padding:5px;border-radius:999px;max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none}
.street .dock{position:absolute}
.dock a{flex:none;text-decoration:none;font:600 14px/1 var(--display);color:var(--ink);padding:11px 16px;border-radius:999px;transition:background .2s,color .2s}
.dock a:hover{background:rgba(255,255,255,.55)}
.dock a[aria-current="page"]{background:rgba(18,18,18,.88);color:#f4f4f1}
.night .dock a{color:#f4f4f1}.night .dock a:hover{background:rgba(255,255,255,.12)}.night .dock a[aria-current="page"]{background:#ffcb05;color:#121212}
.loader{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.street.night{background:#171715}
.night .bubble,.night .bubble .l2 mark{color:#f4f4f1}.night .bubble .l1{color:rgba(244,244,241,.7)}.night .caret{background:#f4f4f1}
#site .dock a.on{background:rgba(18,18,18,.88);color:#f4f4f1}
@media (max-width:640px){
  .street .card{padding:12px 14px 13px;border-radius:18px}
  .card .hi{font-size:15px}.card .tag{font-size:13.5px}
  .ctrls{flex-direction:column;align-items:flex-end}
  .chip{height:38px;padding:0 12px 0 10px;font-size:13px}
  .dock a{padding:10px 9px;font-size:12.5px}
}
.hero-copy{position:absolute;z-index:5;left:var(--gut);top:calc(clamp(64px,10vh,110px) + env(safe-area-inset-top,0px));max-width:min(640px,calc(100vw - 2*var(--gut)));pointer-events:none}
.hero-copy .hey{margin:0 0 14px;display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;text-shadow:0 0 10px var(--ground),0 0 4px var(--ground)}
.hero-copy .wave{font-size:20px}
.hero-copy .big{font:800 clamp(34px,4.3vw,62px)/1.04 var(--head);letter-spacing:-.04em;margin:0;text-shadow:0 0 18px var(--ground),0 0 8px var(--ground)}
.hero-copy .big mark{background:linear-gradient(transparent 52%,rgba(var(--glow),.95) 52% 90%,transparent 90%);color:inherit;padding:0 .06em;text-shadow:none}
.hero-copy .sub{margin:18px 0 0;font-size:clamp(16px,1.3vw,19px);font-weight:500;max-width:44ch;text-shadow:0 0 10px var(--ground),0 0 4px var(--ground)}
.night .hero-copy{color:#f4f4f1}.night .hero-copy .hey,.night .hero-copy .big,.night .hero-copy .sub{text-shadow:0 0 14px #171715,0 0 6px #171715}
.night .hero-copy .big mark{color:var(--yellow);background:linear-gradient(transparent 88%,rgba(255,203,5,.55) 88%);text-shadow:0 0 22px rgba(255,203,5,.45)}
.ctrls{top:calc(26px + env(safe-area-inset-top,0px));gap:10px;align-items:center}
.chip{height:52px;padding:0 20px 0 16px;font-size:16px;gap:10px}
.chip .ic,.chip svg{width:20px;height:20px}
.badge{display:flex;flex-direction:column;justify-content:center;height:52px;padding:0 16px;border-radius:12px;line-height:1.05}
.badge small{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.badge b{font:800 17px/1.1 var(--head);letter-spacing:-.02em}
.dock{padding:7px;gap:4px;bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.dock a{font-size:17px;padding:14px 22px;display:inline-flex;align-items:center;gap:10px}
.dock .me-ic{width:26px;height:26px}
.dock a.cta{background:var(--yellow);color:#121212}
.dock a.cta:hover{background:#ffd633}
.night .dock a.cta{color:#121212}
.bubble{font-size:16px;padding:11px 15px 12px;max-width:min(240px,62vw)}
@media (max-width:900px){.badge{display:none}}
@media (max-width:640px){
  .hero-copy{top:calc(96px + env(safe-area-inset-top,0px))}
  .hero-copy .hey{font-size:15px;margin-bottom:10px}
  .ctrls{flex-direction:row;left:var(--gut);right:auto;top:calc(16px + env(safe-area-inset-top,0px))}
  .chip{height:42px;padding:0 14px 0 12px;font-size:14px}
  .dock{padding:5px;gap:2px}
  .dock a{font-size:12.5px;padding:10px 9px;gap:6px}.dock .me-ic{display:none}
  .bubble{font-size:14px}
}
/* ---------- 2. site ---------- */
#site{display:none}
body.entered #site{display:block;animation:rise .9s var(--ease) both}
@keyframes rise{from{opacity:0}to{opacity:1}}
.bar{position:sticky;top:0;z-index:10;background:rgba(244,244,241,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
body.entered::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:rgba(244,244,241,.88);backdrop-filter:blur(10px)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:18px}
.bar .logo{font-weight:800;font-size:19px;letter-spacing:-.02em;text-decoration:none;}
.bar nav{display:flex;gap:clamp(12px,2vw,26px);font-size:15px;font-weight:500}
.bar nav a{text-decoration:none;padding:6px 0;border-bottom:1.5px solid transparent}
.bar nav a:hover{border-color:currentColor}
.back{font:600 14px/1 var(--display);background:transparent;border:1.5px solid var(--ink);border-radius:999px;padding:9px 14px;cursor:pointer;color:var(--ink)}
.back:hover{background:var(--yellow);border-color:var(--yellow)}

/* about, as laid out in Figma: a ruled notebook page.
   Phones and tablets get a flowing layout; from 1024px up the section is the Figma
   frame itself (1440×1020), scaled with --u so every ratio holds at any width. */
.intro{--hand:'Caveat',cursive;--rule:32px;position:relative;overflow:hidden;color:var(--ink);background:var(--ground);container-type:inline-size}
.intro .wrap{position:relative;padding-top:64px;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));
  background:repeating-linear-gradient(to bottom,transparent 0 calc(var(--rule) - 1px),rgba(0,0,0,.3) calc(var(--rule) - 1px) var(--rule)) 0 40px/100% calc(100% - 40px) no-repeat}
.hand{font-family:var(--hand);font-weight:700;font-style:normal}
.hl{background:linear-gradient(transparent 55%,var(--yellow) 55% 92%,transparent 92%);padding:0 .06em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.intro h1{font:700 clamp(52px,11vw,84px)/.98 var(--display);letter-spacing:-.035em}
.intro h1>span{display:block}
.intro h1 .hey{font-size:.615em}
.intro h1 .hand{font-size:1.18em;letter-spacing:-.01em}
.intro .name{position:relative;display:inline-block;white-space:nowrap}
.intro .name .circle{position:absolute;left:-7%;top:-2%;width:114%;height:auto;pointer-events:none}
.intro .lead{font:600 clamp(18px,2.6vw,22px)/1.32 var(--display);margin:40px 0 0;max-width:36em}
.intro .lead .hand{font-size:1.1em;line-height:1}
.intro .lead strong.hand{font-size:1.18em}
.intro .lead .hl-red{background:linear-gradient(transparent 50%,rgba(255,107,74,.5) 50% 92%,transparent 92%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.intro figure{position:relative;width:min(56vw,340px);margin:20px -4vw -40px auto;pointer-events:none}
.intro figure img{display:block;width:100%;height:auto}
.intro .note{display:none}
.intro .facts{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding-top:32px}
.intro .facts::before{content:"";position:absolute;top:0;left:calc(-1*var(--gut));right:calc(-1*var(--gut));height:1px;background:var(--ink)}
.intro .facts h3{font:700 30px/.98 var(--hand);letter-spacing:-.01em;margin:0 0 18px}
.intro .facts h3 span{background:linear-gradient(transparent 55%,var(--yellow) 55% 100%);padding:0 .08em}
.intro .facts p{margin:0;font:600 16px/1.45 var(--display)}
.intro .facts mark{background:rgba(47,127,216,.2);color:inherit;padding:0 .12em;border-radius:1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.intro .find{position:relative;z-index:2;margin:36px 0 0}
.intro .kw{gap:12px}
.intro .kw button{font:600 15px/1 var(--display);padding:12px 16px;border-radius:50px;border:1px solid rgba(255,255,255,.75);justify-content:center;white-space:nowrap;
  background:linear-gradient(164deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.28) 71%);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:0 12px 16px -6px rgba(18,18,18,.28),inset 0 1px 0 rgba(255,255,255,.9)}
.intro .kw button:hover{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.intro .kw sup{display:none}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (min-width:1024px){
  /* 1u = 1px of the 1440px Figma frame; capped so very wide screens don't balloon */
  .intro .wrap{--u:min(100cqw / 1440,1.25px);--x:calc(50% - 720*var(--u));max-width:none;height:calc(1020*var(--u));padding:0;
    background-position:0 calc(80*var(--u));background-size:100% calc(100% - 80*var(--u));--rule:calc(32*var(--u))}
  .intro .wrap>*{position:absolute;margin:0}
  .intro .about-copy{left:calc(var(--x) + 80*var(--u));top:calc(131*var(--u));width:calc(870*var(--u));z-index:2}
  .intro h1{font-size:calc(104*var(--u));height:calc(170*var(--u))}
  /* Caveat runs narrower than Figma Hand, so the handwritten words get extra size and air */
  .intro h1 .hand{font-size:1.45em;letter-spacing:.015em;line-height:.8}
  .intro h1 .hey{line-height:1.1}
  .intro .lead{font-size:calc(26*var(--u));margin-top:calc(97*var(--u));max-width:none;width:calc(860*var(--u))}
  .intro figure{left:calc(var(--x) + 929*var(--u));top:calc(179*var(--u));width:calc(606*var(--u));z-index:1}
  .intro .note{display:grid;position:absolute;z-index:-1;width:calc(139*var(--u));min-height:calc(119*var(--u));place-items:center;padding:calc(22*var(--u)) calc(10*var(--u)) calc(12*var(--u));background:#ffe98a;
    font:700 calc(20*var(--u))/1.15 var(--hand);text-align:center;color:#000;box-shadow:0 8px 14px -8px rgba(0,0,0,.25)}
  .intro .note::before{content:"";position:absolute;left:50%;top:calc(-12*var(--u));width:calc(81*var(--u));height:calc(32*var(--u));background:rgba(217,217,217,.7);transform:translateX(-50%)}
  .intro .note.n1{left:calc(86*var(--u));top:calc(126*var(--u));transform:rotate(-18.57deg)}
  .intro .note.n2{left:calc(363*var(--u));top:calc(480*var(--u));z-index:1;transform:rotate(23.11deg)}
  .intro .facts{left:var(--x);right:var(--x);top:calc(623*var(--u));padding:calc(37*var(--u)) 0 0 calc(82*var(--u));grid-template-columns:repeat(3,calc(250*var(--u)));column-gap:calc(62*var(--u));z-index:2}
  .intro .facts::before{left:calc(-1*var(--x));right:calc(-1*var(--x))}
  .intro .facts h3{font-size:calc(30*var(--u));margin-bottom:calc(28*var(--u))}
  .intro .facts p{font-size:max(13px,calc(16*var(--u)))}
  .intro .find{left:var(--x);right:var(--x);top:calc(839*var(--u));z-index:3}
  .intro .kw{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:calc(16*var(--u));max-width:none}
  .intro .kw button{height:calc(41*var(--u));padding:0 calc(8*var(--u));font-size:max(11px,calc(15*var(--u)))}
}
.cue{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:15px;text-decoration:none;margin-bottom:22px}
.cue i{width:28px;height:28px;border:2px solid var(--ink);border-radius:50%;position:relative}
.cue i::after{content:"";position:absolute;left:50%;top:6px;width:2px;height:8px;background:var(--ink);transform:translateX(-50%);animation:drip 1.6s var(--ease) infinite}
@keyframes drip{0%{opacity:0;transform:translate(-50%,-3px)}40%{opacity:1}100%{opacity:0;transform:translate(-50%,6px)}}

.night{background:var(--night);color:var(--night-ink)}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px 40px;margin-bottom:clamp(28px,4vw,48px)}
.sec-head h2{font-size:clamp(34px,4.8vw,70px);font-weight:800;letter-spacing:-.035em;line-height:1}
.sec-head p{max-width:38ch;margin:0;color:var(--night-ink-2)}
.maps{padding:clamp(72px,10vw,140px) 0 clamp(40px,6vw,80px)}
.map-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.map{all:unset;box-sizing:border-box;cursor:pointer;background:var(--night-2);border:1.5px solid var(--night-line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .25s,transform .25s var(--ease)}
.map:hover{transform:translateY(-3px);border-color:rgba(244,244,241,.4)}
.map[aria-pressed="true"]{border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow),0 0 34px -8px rgba(var(--glow),.6)}
.map svg{display:block;width:100%;height:auto;aspect-ratio:200/130;background:#191917}
.map .meta{padding:12px 14px 15px;display:flex;flex-direction:column;gap:3px}
.map .code{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--night-ink-2);font-variant-numeric:tabular-nums}
.map[aria-pressed="true"] .code{color:var(--yellow)}
.map .nm{font-size:14px;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.map-detail{margin-top:14px;border:1.5px solid var(--night-line);border-radius:12px;padding:clamp(20px,3vw,34px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px);min-height:210px}
.map-detail h3{font-size:clamp(22px,2.4vw,32px);font-weight:700;letter-spacing:-.025em;line-height:1;margin-bottom:12px}
.map-detail .terrain{color:var(--yellow);font-weight:600;font-size:15px;margin-bottom:12px}
.map-detail p{margin:0;color:var(--night-ink-2);max-width:46ch}
.map-detail h4{margin:0 0 10px;font-size:14px;font-weight:700;color:var(--night-ink-2)}
.map-detail ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.map-detail li{display:flex;align-items:center;gap:10px;font-weight:600}
.map-detail li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--yellow);flex:none;box-shadow:0 0 10px rgba(var(--glow),.8)}
.swap{animation:swap .45s var(--ease)}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.loadout{padding:clamp(56px,8vw,110px) 0 clamp(80px,11vw,150px)}
.loadout .sec-head{flex-direction:column;align-items:center;text-align:center;gap:14px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-width:1040px;margin:0 auto}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.slot{position:relative;background:var(--night-2);border:1.5px solid var(--night-line);border-radius:14px;padding:28px 18px 24px;min-height:200px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;transition:background .25s,transform .25s var(--ease)}
.slot::before{content:"";position:absolute;inset:-1.5px;border-radius:14px;padding:2px;pointer-events:none;opacity:0;
  background:conic-gradient(from var(--a),transparent 0 72%,rgba(255,203,5,.15) 80%,#ffcb05 94%,#fff3b0 97%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.slot.lap::before{animation:orbit 1.5s linear var(--d) 1,lapfade 1.5s linear var(--d) 1 both}
.slot:hover::before{opacity:1;animation:orbit 1.6s linear infinite}
@keyframes orbit{from{--a:0deg}to{--a:360deg}}
@keyframes lapfade{0%{opacity:0}8%{opacity:1}82%{opacity:1}100%{opacity:0}}
.slot:hover{background:#22221f;transform:translateY(-3px)}
.slot .no{position:absolute;top:12px;right:14px;font-size:12px;font-weight:600;color:var(--night-ink-2);font-variant-numeric:tabular-nums}
.slot .mono{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;background:#2a2a27;color:var(--night-ink);margin-bottom:12px;transition:background .25s,color .25s}
.slot .mono svg{width:28px;height:28px;fill:currentColor}
.slot .mono b{font:800 20px/1 var(--head);letter-spacing:-.02em}
.slot:hover .mono{background:var(--yellow);color:var(--on-glow)}
.slot strong{font-size:15px;font-weight:700;letter-spacing:-.01em}
.slot .use{font-size:14px;color:var(--night-ink-2);line-height:1.4;max-width:22ch}
.slot.more{border-style:dashed;background:transparent}

.journey{padding:clamp(80px,11vw,150px) 0}
.journey .sec-head p{color:var(--ink-2)}
.route{position:relative;width:calc(100vw - 48px);max-width:1600px;left:50%;transform:translateX(-50%)}
.route svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.route .stop{position:absolute;width:0;height:0;opacity:.3;transition:opacity .5s}
.route .stop.on{opacity:1}
.route .stop .dot{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--ground);border:2.5px solid var(--ink);transform:translate(-50%,-50%);transition:background .4s,box-shadow .4s}
.route .stop.on .dot{background:var(--yellow);box-shadow:0 0 0 7px rgba(var(--glow),.25)}
.route .stop.last .dot{width:32px;height:32px}
.route .stop.last.on .dot{box-shadow:0 0 0 9px rgba(var(--glow),.3),0 0 34px 8px rgba(var(--glow),.6)}
.route .lbl{position:absolute;top:0;transform:translateY(-50%);width:min(240px,46vw);background:var(--ground);padding:6px 8px;border-radius:8px}
.route .stop.r .lbl{left:24px;text-align:left}
.route .stop.l .lbl{right:24px;text-align:right}
.route .stop b{display:block;font-size:clamp(17px,1.6vw,22px);line-height:1.15;letter-spacing:-.02em;font-weight:700}
.route .stop span{display:block;color:var(--ink-2);font-size:15px;margin-top:4px}

/* ---------- home: scroll to fly in ---------- */
.fly-in{position:absolute;z-index:5;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;font:600 16px/1 var(--display);color:var(--ink);cursor:pointer;opacity:0;transition:opacity .6s}
.loaded .fly-in{opacity:1}
.fly-in i{width:16px;height:24px;border:2px solid currentColor;border-radius:9px;position:relative}
.fly-in i::after{content:"";position:absolute;left:50%;top:4px;width:2px;height:6px;background:currentColor;transform:translateX(-50%);animation:drip 1.6s var(--ease) infinite}
@media (max-width:640px){.fly-in{bottom:calc(80px + env(safe-area-inset-bottom,0px));font-size:14px;padding:10px 16px}}
/* ---------- home, as laid out in Figma ---------- */
.street,.street .chip,.street .bubble{font-family:var(--display)}
.badge2{position:absolute;z-index:5;left:clamp(16px,8.33vw,120px);top:calc(28px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:16px;padding:12px 14px 12px 16px;border-radius:50px;
  background:rgba(255,255,255,.40);
  background:linear-gradient(135deg,rgba(255,255,255,.48) 0%,rgba(255,255,255,.32) 100%);
  border:1.5px solid rgba(255,255,255,.78);
  box-shadow:0 12px 28px -6px rgba(0,0,0,.08),inset 0 1.5px 1.5px 0 rgba(255,255,255,1),inset 0 -1px 1px 0 rgba(255,255,255,.35),inset 0 0 16px rgba(255,255,255,.2)}
.badge2 span{font:600 10px/1 var(--display);letter-spacing:.14em}
.badge2 img{width:28px;height:28px;display:block}
.night .badge2 img{filter:invert(1)}
.street .hero-copy{left:clamp(16px,8.33vw,120px);top:calc(clamp(88px,15.9vh,143px) + env(safe-area-inset-top,0px));max-width:none;width:min(870px,calc(100vw - 2*clamp(16px,8.33vw,120px)));padding:22px 32px 26px 32px;border-radius:50px;pointer-events:none}
.street .hero-copy .hey{font:600 17px/1.2 var(--display);margin:0 0 16px;text-shadow:none;display:block}
.street .hero-copy .big{font:700 clamp(32px,3.75vw,54px)/1.04 var(--display);letter-spacing:-.04em;max-width:700px;text-shadow:none}
.street .hero-copy .big mark{font-family:'Caveat',cursive;font-weight:700;font-size:1em;letter-spacing:0;background:linear-gradient(transparent 56%,rgba(var(--glow),.95) 56% 92%,transparent 92%);padding:0 .08em;color:inherit}
.street .hero-copy .sub{font:500 19px/1.4 var(--display);margin:16px 0 0;max-width:470px;text-shadow:none}
.night .street .hero-copy .big mark,.night .hero-copy .big mark{color:#121212;background:var(--yellow);text-shadow:none;border-radius:6px}
.street .ctrls{top:calc(25px + env(safe-area-inset-top,0px));right:clamp(16px,5vw,72px);gap:16px}
.street .chip{height:52px;border-radius:26px;padding:0 19px 0 18px;gap:9px;font-size:16px;font-weight:600;
  background:rgba(255,255,255,.40);
  background:linear-gradient(135deg,rgba(255,255,255,.48) 0%,rgba(255,255,255,.32) 100%);
  border:1.5px solid rgba(255,255,255,.78);
  box-shadow:0 12px 28px -6px rgba(0,0,0,.08),inset 0 1.5px 1.5px 0 rgba(255,255,255,1),inset 0 -1px 1px 0 rgba(255,255,255,.35),inset 0 0 16px rgba(255,255,255,.2);
  transition:transform .15s,background .25s,box-shadow .25s}
.street .chip:hover{
  background:rgba(255,255,255,.55);
  background:linear-gradient(135deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.45) 100%);
  box-shadow:0 16px 32px -6px rgba(0,0,0,.11),inset 0 1.5px 1.5px 0 rgba(255,255,255,1),inset 0 0 20px rgba(255,255,255,.3)}
.street .bubble{padding:8px 16px 10px;font-size:16px;border-radius:14px 14px 4px 14px;
  background:rgba(255,255,255,.40);
  background:linear-gradient(135deg,rgba(255,255,255,.48) 0%,rgba(255,255,255,.32) 100%);
  border:1.5px solid rgba(255,255,255,.78);
  box-shadow:0 16px 36px -8px rgba(0,0,0,.09),inset 0 1.5px 1.5px 0 rgba(255,255,255,1),inset 0 0 16px rgba(255,255,255,.2)}
.street .bubble .l2{margin-top:6px}
.street .dock,#site .dock{width:min(938px,calc(100vw - 24px));justify-content:space-between;padding:7px;height:64px;align-items:center;
  background:rgba(255,255,255,.40);
  background:linear-gradient(135deg,rgba(255,255,255,.46) 0%,rgba(255,255,255,.34) 100%);
  border:1.5px solid rgba(255,255,255,.75);
  box-shadow:0 20px 44px -10px rgba(0,0,0,.10),0 4px 10px rgba(0,0,0,.03),inset 0 1.5px 1.5px 0 rgba(255,255,255,1),inset 0 -1.5px 1.5px 0 rgba(255,255,255,.40),inset 0 0 20px rgba(255,255,255,.22)}
.dock a{padding:13px 22px}
.dock a[data-nav="top"],.dock a.cta{min-width:128px;justify-content:center}
.dock .arr{width:12px;height:12px}
.night .badge2,.night .street .chip,.night .street .dock,.night #site .dock{
  background:rgba(255,255,255,.08);
  background:linear-gradient(135deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,.04) 100%);
  border-color:rgba(255,255,255,.22);
  box-shadow:0 16px 36px -8px rgba(0,0,0,.55),inset 0 1.5px 1.5px 0 rgba(255,255,255,.40),inset 0 0 18px rgba(255,255,255,.06)}
.night .street .chip:hover{
  background:linear-gradient(135deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.08) 100%)}
@media (max-width:640px){
  .badge2{padding:9px 12px;gap:10px}.badge2 img{width:22px;height:22px}
  .street .ctrls{left:auto;right:12px;top:calc(18px + env(safe-area-inset-top,0px));flex-direction:row}
  .street .chip{height:40px;padding:0 12px;font-size:13px}.street .chip .lb{display:none}
  .street .hero-copy{top:calc(84px + env(safe-area-inset-top,0px));padding:16px 18px 18px;border-radius:26px}
  .street .hero-copy .hey{font-size:14px;margin-bottom:10px}.street .hero-copy .sub{font-size:15px;margin-top:10px}
  .street .dock,#site .dock{height:52px;padding:5px;justify-content:flex-start;gap:0}.dock a{padding:10px 7px;font-size:12.5px}.dock .me-ic{display:none}.dock a[data-nav="top"],.dock a.cta{min-width:0}.dock .arr{display:none}
}
/* ---------- journey: fly along the route ---------- */
.fly{height:560vh;position:relative;background:var(--ground)}
.fly-stage{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden}
#flyCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fly-head{position:absolute;z-index:3;left:var(--gut);top:calc(28px + env(safe-area-inset-top,0px));pointer-events:none}
.fly-head h2{font-size:clamp(28px,3.6vw,52px);font-weight:800;letter-spacing:-.035em;line-height:1}
.fly-head p{margin:10px 0 0;font-size:16px;font-weight:500;color:var(--ink-2)}
.fly-tags{position:absolute;inset:0;z-index:2;pointer-events:none}
.fly-tag{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border-radius:999px;font:700 15px/1 var(--display);color:var(--ink);cursor:pointer;white-space:nowrap;transition:opacity .3s}
.fly-tag em{font-style:normal;font-size:12px;font-weight:700;background:rgba(18,18,18,.86);color:#f4f4f1;padding:5px 9px;border-radius:999px}
.fly-tag.on em{background:var(--yellow);color:#121212}
.fly-tag::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:16px;background:rgba(18,18,18,.35);transform:translateX(-50%)}
.fly-card{position:absolute;z-index:3;left:var(--gut);bottom:calc(112px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 2*var(--gut)));padding:22px 24px 24px;border-radius:22px}
.fly-card .no{font-size:13px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.fly-card h3{font-size:clamp(20px,1.8vw,26px);font-weight:700;letter-spacing:-.025em;line-height:1.15;margin:8px 0 10px}
.fly-card p{margin:0;font-size:16px;line-height:1.5}
.fly-card .in{animation:cardIn .55s var(--ease)}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fly-dots{position:absolute;z-index:3;right:var(--gut);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
.fly-dots button{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:transparent;padding:0;cursor:pointer;transition:background .25s,transform .25s}
.fly-dots button.on{background:var(--yellow);transform:scale(1.3)}
.fly-hint{position:absolute;z-index:3;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;font-size:15px;font-weight:600;transition:opacity .4s}
.fly-hint i{width:16px;height:24px;border:2px solid var(--ink);border-radius:9px;position:relative}
.fly-hint i::after{content:"";position:absolute;left:50%;top:4px;width:2px;height:6px;background:var(--ink);transform:translateX(-50%);animation:drip 1.6s var(--ease) infinite}
@media (max-width:640px){.fly-tag{font-size:12.5px;padding:5px 5px 5px 11px}.fly-tag em{font-size:10.5px}.fly-card{bottom:calc(88px + env(safe-area-inset-bottom,0px));padding:16px 18px}.fly-card p{font-size:14.5px}.fly-dots{top:auto;bottom:calc(270px + env(safe-area-inset-bottom,0px));transform:none}.fly-hint{display:none}}
/* keywords */
.find{margin:0 0 30px}
.find-label{display:block;font-size:15px;font-weight:700;margin-bottom:12px}
.kw{display:flex;flex-wrap:wrap;gap:8px;max-width:640px}
.kw button,.filters button{font:600 15px/1 var(--display);color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:999px;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .2s,color .2s,transform .15s}
.kw button:hover{background:var(--ink);color:var(--yellow)}
.kw button:active,.filters button:active{transform:scale(.97)}
.kw button sup,.filters button sup{font-size:11px;font-weight:700;opacity:.65;vertical-align:baseline}
.filters{max-width:none;justify-content:flex-start}
.work .work-head{flex-direction:column;align-items:flex-start}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.filters button:hover:not([aria-pressed="true"]){background:rgba(var(--glow),.6)}
.proj.pulse .row::before{opacity:1;animation:fade 1.6s var(--ease) forwards}
@keyframes fade{0%{opacity:1}100%{opacity:0}}
/* work + contact (carried over) */
.work{padding:clamp(56px,8vw,110px) 0;border-top:1px solid var(--line)}
.work-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}
.work-head h2{font-size:clamp(34px,4.8vw,70px);letter-spacing:-.035em;line-height:1;font-weight:800}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.filters button:hover:not([aria-pressed="true"]){background:rgba(var(--glow),.6)}
.list{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.proj{border-bottom:1.5px solid var(--line)}
.proj[hidden]{display:none}
.row{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.3fr) minmax(0,.9fr) 64px;gap:24px;align-items:baseline;padding:clamp(20px,2.6vw,30px) 14px;position:relative;isolation:isolate}
.row::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .35s;background:radial-gradient(60% 140% at 18% 50%,rgba(var(--glow),.85),rgba(var(--glow),.25) 55%,rgba(var(--glow),0))}
.row:hover::before,.row:focus-visible::before,.proj.open .row::before{opacity:1}
.row .t{font-size:clamp(20px,2.2vw,30px);font-weight:700;letter-spacing:-.025em;line-height:1.05}
.row .hook,.row .meta{color:var(--ink-2)}.row .meta{font-size:15px}
.row .yr{font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.proj.open .detail{grid-template-rows:1fr}
.detail>div{overflow:hidden}
.detail-in{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(20px,3vw,44px);padding:10px 14px 36px}
.slot-img{aspect-ratio:16/10;border:1.5px dashed var(--ink-2);border-radius:14px;display:grid;place-items:center;text-align:center;font-size:15px;font-weight:500;color:var(--ink-2);padding:20px;background:var(--ground-2)}
.detail p{margin:0 0 14px;max-width:52ch}
.detail .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.detail .tags span{font-size:14px;border:1.5px solid var(--line);border-radius:999px;padding:5px 11px}
.empty{padding:40px 14px;font-size:17px;font-weight:600}
.contact{padding:clamp(80px,12vw,170px) 0 40px;border-top:1px solid var(--line)}
.contact h2{font-size:clamp(34px,5.6vw,84px);letter-spacing:-.035em;line-height:1;margin:0 0 28px;font-weight:800;max-width:14ch}
.contact p{max-width:44ch;margin:0 0 28px;color:var(--ink-2)}
.btn{display:inline-flex;align-items:center;font:700 17px/1 var(--display);color:var(--on-glow);text-decoration:none;background:var(--yellow);border:0;border-radius:999px;padding:15px 24px;cursor:pointer;transition:box-shadow .3s,transform .15s}
.btn:hover{box-shadow:0 0 28px 6px rgba(var(--glow),.55)}.btn:active{transform:scale(.97)}
.links{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:40px;font-size:17px}
.links a{text-decoration:none;border-bottom:1.5px solid var(--line);padding-bottom:2px}
footer{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1.5px solid var(--line);margin-top:clamp(64px,9vw,120px);padding:20px 0 28px;font-size:15px;color:var(--ink-2)}

@media (max-width:1000px){
  .map-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .slots{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar nav{display:none}
}
@media (max-width:900px){
  .map-detail{grid-template-columns:1fr}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:6px 14px}
  .row .hook{grid-column:1/-1;grid-row:2}.row .meta{grid-column:1;grid-row:3}.row .yr{grid-column:2;grid-row:1}
  .detail-in{grid-template-columns:1fr}
}

<script>
(()=>{
/* ================= sprites: realistic silhouettes with a charcoal edge ================= */
const SW=130,SH=196,BASE=12,RS=.8,WF=12,TAU=Math.PI*2;
const CROWD='#111111',HERO_COL='#ffcb05';
let rs=1;const seed=s=>{rs=s|0};
function R(){rs=(rs+0x6D2B79F5)|0;let t=Math.imul(rs^(rs>>>15),1|rs);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;}
const J=()=>R()-.5;
const dot=(c,x,y,r)=>{c.beginPath();c.arc(x,y,r,0,TAU);c.fill();};
const pt=(x,y,a,L)=>[x+Math.sin(a)*L,y+Math.cos(a)*L];
function limb(c,x1,y1,x2,y2,w1,w2){const dx=x2-x1,dy=y2-y1,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;
  c.beginPath();c.moveTo(x1+nx*w1/2,y1+ny*w1/2);c.lineTo(x2+nx*w2/2,y2+ny*w2/2);c.lineTo(x2-nx*w2/2,y2-ny*w2/2);c.lineTo(x1-nx*w1/2,y1-ny*w1/2);c.closePath();c.fill();
  dot(c,x1,y1,w1/2);dot(c,x2,y2,w2/2);}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();c.fill();}
function poly(c,p){c.beginPath();c.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)c.lineTo(p[i],p[i+1]);c.closePath();c.fill();}

const TYPES=[
  {g:'m',w:17,h:1,top:'shirt',acc:'sling'},
  {g:'f',w:13.5,h:.95,top:'dress',hair:'pony'},
  {g:'m',w:17.5,h:1.02,top:'coat',hair:'hat'},
  {g:'f',w:13.5,h:.94,top:'skirt',hair:'long',acc:'handbag'},
  {g:'m',w:18.5,h:.99,top:'shirt',heavy:1,acc:'phone'},
  {g:'f',w:14,h:.95,top:'maxi',hair:'bun'},
  {g:'m',w:17,h:1.01,top:'jacket',acc:'backpack',hair:'cap'},
  {g:'k',w:12,h:.66,top:'shirt',acc:'backpack'},
  {g:'m',w:16.5,h:.99,top:'jacket',acc:'briefcase'},
  {g:'f',w:13.5,h:.95,top:'shirt',hair:'long',acc:'phone'},
  {g:'m',w:17,h:1,top:'jacket',acc:'pockets'},
  {g:'f',w:14,h:.94,top:'coat',hair:'bun',acc:'handbag'},
  {g:'k',w:11,h:.6,top:'dress',hair:'pony'},
  {g:'m',w:16.5,h:.98,top:'shirt',acc:'pockets',hair:'cap'}
];
const TONES=['#1b1b1a','#34332f','#121212','#2a2927','#3e3d39','#202020','#2f2f2c','#161616','#383734','#242423','#3a3936','#1e1d1c','#2c2b29','#131313'];

function person(c,T,ph,amp,mode){
  // organic silhouette: tapered limbs with round joints, curved torso, oval head
  c.save();c.scale(T.h,T.h);c.lineCap='round';c.lineJoin='round';
  const fem=T.g==='f',kid=T.g==='k',heavy=!!T.heavy;
  const la=(T.top==='maxi'?.55:1)*amp,hipY=-80,L1=41,L2=39;
  const legs=[ph+Math.PI,ph].map(q=>{const a=.33*la*Math.sin(q),kb=la*(.06+.72*Math.pow(Math.max(0,Math.cos(q)),1.5));
    const k=pt(0,hipY,a,L1),an=pt(k[0],k[1],a-kb,L2);return{k,an};});
  const ground=Math.max(legs[0].an[1],legs[1].an[1])+2.6;
  c.translate(0,-ground);
  const lean=mode==='walk'?amp*2.6:0,sway=lean*1.1;
  const sx=lean,sy=-132,hx=lean+1.2,hy=-149,hr=kid?11.8:9.4;
  const sw=T.w*.78,ww=T.w*(heavy?.86:fem?.5:.56),hw=T.w*(fem?.84:.68);
  const tw=(fem?9.6:10.6)+(heavy?2:0);
  const st=(pts,w)=>{c.lineWidth=w;c.beginPath();c.moveTo(pts[0],pts[1]);if(pts.length===4)c.lineTo(pts[2],pts[3]);else c.quadraticCurveTo(pts[2],pts[3],pts[4],pts[5]);c.stroke();};
  const mid=(a,b,t=.5)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
  const drawLeg=L=>{const h=[0,hipY],m1=mid(h,L.k,.55),m2=mid(L.k,L.an,.4);
    st([h[0],h[1],m1[0],m1[1]],tw);st([m1[0],m1[1],L.k[0],L.k[1]],tw*.74);
    st([L.k[0],L.k[1],m2[0],m2[1]],tw*.72);st([m2[0],m2[1],L.an[0],L.an[1]],tw*.44);
    c.beginPath();c.ellipse(L.an[0]+3.2,L.an[1]+.6,5.8,2.4,.06,0,TAU);c.fill();};
  const arm=(near,q)=>{
    const shx=sx+(near?1:-1)*(sw-3.2)*.35,shy=sy+4.5;let e,hd;
    if(near&&T.acc==='phone'){e=pt(shx,shy,.28,25);hd=[hx+hr*.55,hy+6];st([shx,shy,e[0],e[1]],6.4);st([e[0],e[1],hd[0],hd[1]],4.8);rr(c,hd[0]-1.4,hd[1]-5.5,3.6,8.5,1.4);return;}
    if(T.acc==='pockets'){e=pt(shx,shy,near?.12:-.05,25);hd=[shx+(near?4.5:1.5),hipY+3];}
    else if(near&&(T.acc==='handbag'||T.acc==='briefcase')){const ua=.05*amp*Math.sin(q);e=pt(shx,shy,ua,25);hd=pt(e[0],e[1],ua+.05,24);}
    else{const ua=-.3*amp*Math.sin(q),fa=ua+.18+Math.max(0,ua)*.7;e=pt(shx,shy,ua,25);hd=pt(e[0],e[1],fa,24);}

  // shadows first, so every figure stands on top of them
  if(e<.6){const sa=(night?.16:.3)*(1-e/.6);
    for(const p of act){if(!isFinite(p.ph))continue;const [x,y,Z]=at(p.x,p.y),s=scaleAt(p.y)*Z,set=SPR[p.t];
      const fr=p.spd<10?set[WF]:(set[Math.floor((((p.ph%TAU)+TAU)%TAU)/TAU*WF)%WF]||set[WF]);
      shadow(fr.base,x,y,s,p.face,sa*Math.min(1,(now-(p.born||0))/700));}
    shadow(HSHADOW,hx,hy,hs*hz,1,sa);}
  const list=act.slice();list.push(hero);list.sort((a,b)=>a.y-b.y);if(e>0){list.splice(list.indexOf(hero),1);list.push(hero);}
  for(const p of list){
    if(p===hero){
      const hg=90*K*hz;gr=ctx.createRadialGradient(hx,cy,0,hx,cy,hg);gr.addColorStop(0,`rgba(${C.glow},.3)`);gr.addColorStop(1,`rgba(${C.glow},0)`);
      ctx.globalAlpha=1;ctx.fillStyle=gr;ctx.beginPath();ctx.arc(hx,cy,hg,0,TAU);ctx.fill();
      ctx.save();ctx.shadowColor=`rgba(${C.glow},.75)`;ctx.shadowBlur=16*K*hz;blit(HSPR[0],hx,hy,hs*hz,1,1);ctx.restore();
      continue;
    }
    if(!isFinite(p.ph))p.ph=0;
    const [x,y,Z]=at(p.x,p.y),s=scaleAt(p.y)*Z,set=(night&&SPRN?SPRN:SPR)[p.t];
    if(x<-300*Z||x>W+300*Z||y<-60||y>H+400*Z)continue;
    const fr=p.spd<10?set[WF]:(set[Math.floor((((p.ph%TAU)+TAU)%TAU)/TAU*WF)%WF]||set[WF]);
    const fade=Math.min(1,(now-(p.born||0))/700)*Math.max(0,Math.min(1,1.5-(Z-1)/6));
    if(fade<=0)continue;
    blit(fr.base,x,y,s,p.face,fade);
    if(p.lit>.03&&e<.3){const side=Math.sign(hero.x-p.x||1)*p.face;blit(side>0?fr.rimR:fr.rimL,x,y,s,p.face,(night?Math.min(.8,p.lit*.95):Math.min(.38,p.lit*.42))*fade);}
  }
}
function placeBubble(){const s=scaleAt(hero.y);bubble.style.left=(hero.x-6)+'px';bubble.style.top=(hero.y-166*s-12)+'px';}

/* typewriter */
const L1='Hi, I’m Utkarsh.',L2='Choose me to know more.';
const l1=bubble.querySelector('.l1'),l2=bubble.querySelector('.l2'),caret=document.createElement('i');caret.className='caret';
let typed=false;
function typeOut(){
  if(typed)return;typed=true;bubble.classList.add('show');
  if(RM){l1.textContent=L1;l2.innerHTML='<mark>'+L2+'</mark>';return;}
  let i=0,j=0;l1.appendChild(caret);
  const step=()=>{
    if(i<L1.length){l1.textContent=L1.slice(0,++i);l1.appendChild(caret);setTimeout(step,i===3?220:46);}
    else if(j===0&&!l2.dataset.go){l2.dataset.go=1;setTimeout(step,520);}
    else if(j<L2.length){l2.textContent=L2.slice(0,++j);l2.appendChild(caret);setTimeout(step,44);}
    else{l2.innerHTML='<mark>'+L2+'</mark>';l2.appendChild(caret);}
  };setTimeout(step,350);
}

/* entering: Utkarsh fills the screen, then the site opens */
function heroHit(x,y){const s=scaleAt(hero.y);return Math.abs(x-hero.x)<30*s+10&&y>hero.y-175*s&&y<hero.y+8;}
const flashInk=document.createElement('div');flashInk.className='flash';flashInk.style.background='#121212';document.body.insertBefore(flashInk,flash);
function enter(dest){
  if(state!=='street'||!loaded)return;state='zoom';zoomStart=performance.now();bubble.classList.remove('show');
  const C0=hero.x+'px '+(hero.y-80*scaleAt(hero.y))+'px',ease='cubic-bezier(.7,0,.2,1)';
  const wipe=(el,delay,dur)=>el.animate([{opacity:1,clipPath:`circle(0% at ${C0})`},{opacity:1,clipPath:`circle(150% at ${C0})`}],{duration:RM?1:dur,delay:RM?0:delay,easing:ease,fill:'forwards'});
  setTimeout(()=>{
    wipe(flashInk,0,620);
    const a=wipe(flash,230,620);
    a.onfinish=()=>{
      location.href='about.html'+(dest&&dest!=='about'?'#'+dest:'');
    };
  },RM?0:950);
}
function leave(){
  document.body.classList.remove('entered');state='street';running=true;last=performance.now();
  flash.getAnimations().forEach(a=>a.cancel());flashInk.getAnimations().forEach(a=>a.cancel());resize();setTimeout(()=>bubble.classList.add('show'),300);
}
bubble.addEventListener('click',()=>enter());
// coming back from about.html (back button): open the street again
addEventListener('pageshow',e=>{if(e.persisted&&!document.body.classList.contains('entered'))leave();});
// play / pause and day / night
const playBtn=document.getElementById('playBtn'),themeBtn=document.getElementById('themeBtn');
const PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8v14.4c0 .8.9 1.3 1.6.8l11-7.2c.6-.4.6-1.2 0-1.6l-11-7.2C7.9 3.5 7 4 7 4.8z"/></svg>',PAUSE=playBtn.querySelector('.ic').innerHTML;
const MOON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8.5 8.5 0 0 1 9.4 4a8.5 8.5 0 1 0 10.6 10.6z"/></svg>',SUN=themeBtn.querySelector('.ic').innerHTML;
playBtn.addEventListener('click',()=>{paused=!paused;playBtn.setAttribute('aria-pressed',paused);playBtn.setAttribute('aria-label',paused?'Play the crowd':'Pause the crowd');
  playBtn.querySelector('.ic').innerHTML=paused?PLAY:PAUSE;playBtn.querySelector('.lb').textContent=paused?'Play':'Pause';});
themeBtn.addEventListener('click',()=>{night=!night;if(night)buildNight();street.classList.toggle('night',night);C.ground=night?'#171715':'#f4f4f1';paintGround();
  themeBtn.setAttribute('aria-pressed',night);themeBtn.setAttribute('aria-label',night?'Switch to day':'Switch to night');
  themeBtn.querySelector('.ic').innerHTML=night?MOON:SUN;themeBtn.querySelector('.lb').textContent=night?'Night':'Day';});
// docks: on the street every link walks you in; inside, links scroll and Home walks you back out
street.querySelectorAll('.dock a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const t=a.dataset.nav;if(t==='top')return;enter(t==='resume'?'contact':t);}));
['hero-copy','ctrls','badge2'].forEach(c=>{const el=street.querySelector('.'+c);el.addEventListener('click',e=>e.stopPropagation());});
street.addEventListener('click',e=>{const r=street.getBoundingClientRect();if(heroHit(e.clientX-r.left,e.clientY-r.top))enter();});
function mv(e){const r=street.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;P.tx=x;P.ty=y;P.last=performance.now();
  street.style.cursor=heroHit(x,y)?'pointer':'default';}
street.addEventListener('pointermove',mv,{passive:true});street.addEventListener('pointerdown',mv,{passive:true});
addEventListener('resize',resize);

let last=performance.now(),shown=-1;
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(!loaded){const lin=Math.min(1,(now-t0)/3200);progress=1-Math.pow(1-lin,2);
    const v=Math.round(progress*100);if(v!==shown){pct.textContent=v;shown=v;}
    if(progress>=1){loaded=true;followAt=now+1400;street.classList.add('loaded');setTimeout(typeOut,300);}}
  if(running){update(dt,now);draw(now);if(state==='street')placeBubble();}
  requestAnimationFrame(frame);
}
buildSprites();resize();requestAnimationFrame(frame);
// deep links skip the intro
const OLD={"#about":"","#maps":"","#loadout":"#loadout","#work":"#projects","#projects":"#projects","#journey":"#journey","#contact":"#contact","#resume":"#contact"};
if(location.hash in OLD)location.replace("about.html"+OLD[location.hash]);
})();
</script>
<script>(()=>{/* dock: a glass pill follows hover and settles on the current item */
document.querySelectorAll('nav.dock').forEach(d=>{
  const ind=document.createElement('span');ind.className='dock-ind';ind.setAttribute('aria-hidden','true');d.prepend(ind);
  const cur=()=>d.querySelector('a.on:not(.cta)')||d.querySelector('a[aria-current="page"]');
  const move=a=>{d.querySelectorAll("a").forEach(x=>x.classList.toggle("at",x===a));if(!a){ind.style.opacity=0;return;}ind.style.opacity=1;ind.style.width=a.offsetWidth+'px';ind.style.transform=`translate(${a.offsetLeft}px,-50%)`;};
  ind.style.transition='none';move(cur());void ind.offsetWidth;ind.style.transition='';
  d.addEventListener('pointerover',e=>{const a=e.target.closest('a');if(a&&!a.classList.contains('cta'))move(a);});
  d.addEventListener('pointerleave',()=>move(cur()));
  d.addEventListener('focusin',e=>{const a=e.target.closest('a');if(a&&!a.classList.contains('cta'))move(a);});
  d.addEventListener('focusout',()=>move(cur()));
  addEventListener('resize',()=>move(cur()));
  d.dockMove=()=>move(cur());
});
})();</script>
